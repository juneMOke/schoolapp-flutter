name: school_app_flutter
description: "A school management App"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  dio: ^5.9.2
  retrofit: ^4.9.2
  go_router: ^17.1.0
  flutter_secure_storage: ^10.0.0
  equatable: ^2.0.8
  dartz: ^0.10.1
  json_annotation: ^4.11.0
  flutter_native_splash: ^2.4.4
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.3
  fl_chart: ^0.69.0
  package_info_plus: ^8.1.0

  # ── Offline-first (socle) ────────────────────────────────────────────────
  # Base locale chiffrée (SQLCipher), génération d'UUID client (idempotence),
  # détection de connectivité pour le vidage opportuniste de l'outbox.
  sqflite_sqlcipher: ^3.1.0+1
  sqflite_common: ^2.5.4+6
  path: ^1.9.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  # Vérificateur de mot de passe offline (ADR-010 D-02) : Argon2id local calculé
  # en isolate. Ne chiffre rien — valide seulement « ce mot de passe est-il correct ? ».
  cryptography: ^2.7.0

  # ── Éditique (module documents) ──────────────────────────────────────────
  # Visionneuse PDF + impression + partage des pièces scellées rendues par le
  # serveur. Retenu parce qu'il couvre les trois gestes à lui seul, sans aucune
  # permission Android ni ligne à ajouter au manifeste de l'app : le plugin
  # déclare son propre `<provider>` (`PrintFileProvider`), fusionné au build.
  #
  # ⚠️ À savoir : `Printing.sharePdf` n'est PAS un partage en mémoire. Il écrit
  # d'abord la pièce en clair dans `cacheDir/share/<nom>.pdf` et ne la supprime
  # jamais (PrintingJob.java:322-337). Le répertoire est privé à l'application
  # (effacé par « vider le cache » et par la pression mémoire d'Android), mais
  # un reçu financier y séjourne. L'affichage et l'impression, eux, restent
  # bien en mémoire.
  #
  # Enregistrer volontairement une pièce sur l'appareil reste hors périmètre.
  printing: ^5.14.3
  # Résolution du répertoire de cache, pour PURGER le dossier de partage laissé
  # en clair par `Printing.sharePdf` à chaque fin de session (ADR-012 D-7/PO-5).
  # Déjà présent en transitif (flutter_secure_storage_windows) — déclaré en
  # direct parce qu'il est désormais importé par du code de l'application.
  path_provider: ^2.1.5
  # Rendu du ticket provisoire 80 mm (ADR-012 D-4). Déjà tiré en transitif par
  # `printing` — déclaré en direct parce que du code de l'application l'importe
  # désormais (`depend_on_referenced_packages`), et PINÉ sur la version résolue
  # par `printing` pour que les deux ne divergent jamais.
  pdf: 3.12.0

  # ── Impression thermique ESC/POS (ADR-012 L2.4) ──────────────────────────
  # Envoi d'octets bruts à une imprimante Bluetooth Classic (RFCOMM/SPP), pour
  # le ticket provisoire 80 mm. Retenu contre `flutter_bluetooth_serial` et
  # `blue_thermal_printer`, tous deux sans mise à jour depuis quatre ans.
  #
  # ⚠️ PINÉ SOUS LA DERNIÈRE VERSION : la 1.2.2 exige Flutter >= 3.44.0, le
  # projet est en 3.41.6. Elle n'apporte de toute façon qu'une migration Swift
  # d'iOS/macOS — hors périmètre, puisque l'impression thermique est Android
  # seul. Le code natif Android des deux versions est IDENTIQUE (diffé dans le
  # cache pub, pas déduit du journal des modifications).
  #
  # ⚠️ Ne JAMAIS l'importer hors de `PrintBluetoothThermalChannel` : le paquet
  # n'expose que des méthodes statiques, donc tout appelant direct devient
  # intestable. Trois comportements vérifiés dans le source Kotlin de la version
  # RÉSOLUE (1.2.1) et documentés sur ce fichier :
  #   1. `writeBytes` préfixe le flux d'un `\n` → un seul envoi par ticket ;
  #   2. `connectionStatus` ÉCRIT une espace sur le flux pour sonder la liaison ;
  #   3. sans `BLUETOOTH_CONNECT` sur Android 12+, le gestionnaire natif rend la
  #      main sans terminer le `Future` → l'appel PEND. D'où l'ordre imposé par
  #      `ThermalPrinterAdapter` (permission d'abord) et ses délais.
  #
  # Son manifeste déclare 5 permissions qui se fusionnent dans le nôtre : voir
  # `android/app/src/main/AndroidManifest.xml`, qui en borne deux et en requalifie
  # une. ⚠️ `BLUETOOTH_SCAN` en fait partie et est INDISPENSABLE bien qu'on ne
  # découvre jamais : `connect()` appelle `cancelDiscovery()`, qui en relève.
  print_bluetooth_thermal: ^1.2.1
  # `BLUETOOTH_CONNECT` est une permission RUNTIME depuis Android 12, et le
  # paquet ci-dessus sait seulement la CONSTATER — son code de sollicitation est
  # commenté. Sans ce paquet, aucune tablette récente ne pourrait accorder la
  # permission depuis l'application. C'est la première permission runtime du
  # dépôt : le manifeste ne déclarait que `INTERNET` avant ce lot.
  #
  # ⚠️ PINÉ SOUS LA DERNIÈRE VERSION, et le motif est dans la chaîne de build,
  # pas dans Dart : `permission_handler_android` 14 déclare AGP 9.0.1 +
  # Kotlin 2.3.20 dans son `buildscript` et appelle `kotlin { compilerOptions }`
  # sans jamais appliquer le plugin Kotlin — le script échoue à compiler sur la
  # chaîne du projet (AGP 8.11.1, Kotlin 2.2.20, Gradle 8.14). Monter AGP à 9
  # est un chantier à part entière. Constaté par un `flutter build apk` réel,
  # pas déduit d'un journal des modifications.
  permission_handler: ^12.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  build_runner: ^2.13.1
  mocktail: ^1.0.4
  json_serializable: ^6.13.1
  injectable_generator: ^2.12.1
  retrofit_generator: ^10.2.3
  flutter_gen_runner: ^5.13.0+1
  flutter_launcher_icons: ^0.14.1
  # Base sqflite en mémoire pour les tests unitaires des DAO/outbox (hors device).
  sqflite_common_ffi: ^2.3.4


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  assets:
    - lib/features/auth/data/datasources/
    - assets/catalogs/address_geo_catalog.json
    - assets/catalogs/education_cycles_catalog.json
    - assets/branding/clair/
    - assets/branding/fonce/
    - assets/branding/profond/
    - assets/branding/splash/
    - assets/patterns/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter_18pt-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/lora/Lora-Regular.ttf
          weight: 400
        - asset: assets/fonts/lora/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/lora/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/lora/Lora-Italic.ttf
          weight: 400
          style: italic
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/roboto_mono/RobotoMono-Regular.ttf
          weight: 400


# Splash natif (couche A) — fond Bleu Profond (#0E2D42), symbole crème
# transparent lisible sur fond sombre. Splash sombre en thème clair ET sombre
# (color_dark/image_dark identiques) pour un raccord A→B→W sans saut visuel.
flutter_native_splash:
  color: "#0E2D42"
  image: assets/app-icon/ic_launcher_foreground.png
  color_dark: "#0E2D42"
  image_dark: assets/app-icon/ic_launcher_foreground.png
  android_12:
    image: assets/app-icon/ic_launcher_foreground.png
    color: "#0E2D42"
    image_dark: assets/app-icon/ic_launcher_foreground.png
    color_dark: "#0E2D42"
  web: false

# Icône de lancement ETEELO CONNECT (toutes plateformes sauf Linux, non pris en
# charge par l'outil). Régénérer après modif :
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/app-icon/appstore_1024.png"
  android: true
  min_sdk_android: 21
  # Icône adaptative Android : symbole crème sur fond Bleu Profond uni.
  adaptive_icon_background: "#0E2D42"
  adaptive_icon_foreground: "assets/app-icon/ic_launcher_foreground.png"
  ios: true
  # iOS refuse la transparence : aplatir l'alpha sur le Bleu Profond.
  remove_alpha_ios: true
  background_color_ios: "#0E2D42"
  web:
    generate: true
    image_path: "assets/app-icon/appstore_1024.png"
    background_color: "#0E2D42"
    theme_color: "#0E2D42"
  macos:
    generate: true
    image_path: "assets/app-icon/appstore_1024.png"
  windows:
    generate: true
    image_path: "assets/app-icon/appstore_1024.png"
    icon_size: 48
