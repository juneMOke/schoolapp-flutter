name: Flutter CI

on:
  push:
    branches: [ main, master, develop, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 0 — Réutiliser la vérification de la PR (même règle que le back)
  # Un merge sur `main` ne rejoue pas les tests quand la PR a déjà testé
  # exactement le même arbre : la PR contenait le `main` dans lequel elle a
  # été fusionnée (`HEAD^1` ancêtre de `HEAD^2`), donc le `main` qu'a vu son
  # dernier run en était aussi un ancêtre, et ce run, vert, portait sur
  # `HEAD^2`. Sinon (main a bougé depuis, squash, push direct), on teste
  # comme avant.
  # Propre au front (le back ne teste qu'au push sur `main`) : un push sur
  # une branche de travail (`fix/**`, `feature/**`) dont une PR est ouverte
  # déclenche aussi le run `pull_request` de cette PR, qui teste la fusion
  # avec la base — plus strict que la tête seule, et c'est lui qui garde la
  # fusion. Le run `push` est alors une redite : on s'en remet à la PR.
  # ─────────────────────────────────────────────────────────────────
  already-verified:
    name: Reuse the PR verification
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.check.outputs.reuse }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare with the last green PR run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reuse=false
          if PR_HEAD=$(git rev-parse -q --verify HEAD^2) \
             && git merge-base --is-ancestor HEAD^1 "$PR_HEAD" \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$PR_HEAD^{tree}")" ]; then
            GREEN=$(gh api "repos/${{ github.repository }}/actions/workflows/flutter_ci.yml/runs?event=pull_request&status=success&head_sha=${PR_HEAD}" \
              --jq '.total_count' || echo 0)
            if [ "${GREEN:-0}" -gt 0 ]; then
              reuse=true
              echo "✓ ${PR_HEAD} déjà vert en PR, sur le même arbre : tests non rejoués"
            else
              echo "Aucun run de PR vert pour ${PR_HEAD} : tests rejoués"
            fi
          else
            echo "main a bougé depuis le dernier run de la PR (ou pas de merge) : tests rejoués"
          fi
          case "${{ github.ref_name }}" in
            main|master|develop) ;;
            *)
              if [ "$reuse" != true ]; then
                OPEN_PR=$(gh api "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:${{ github.ref_name }}" \
                  --jq '.[0].number // empty' || true)
                if [ -n "$OPEN_PR" ]; then
                  reuse=true
                  echo "✓ PR #${OPEN_PR} ouverte : son run pull_request vérifie ce commit, run push non rejoué"
                fi
              fi
              ;;
          esac
          echo "reuse=${reuse}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────
  # Job 1 — Validation des variables d'environnement (fail fast)
  # ─────────────────────────────────────────────────────────────────
  validate-env:
    name: Validate env config (dev smoke test)
    needs: already-verified
    if: ${{ !cancelled() && needs.already-verified.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate DEV env variables
        run: |
          bash scripts/validate_env.sh \
            --env=dev \
            --api-base-url="${{ secrets.DEV_API_BASE_URL || 'http://localhost:8080' }}"

  # ─────────────────────────────────────────────────────────────────
  # Job 2 — Analyse statique + tests
  # ─────────────────────────────────────────────────────────────────
  analyze-and-test:
    name: Analyze & Test
    needs: validate-env
    if: ${{ !cancelled() && needs.validate-env.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart format
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Motion tokens check (no hardcoded Duration in UI scope)
        run: bash scripts/check_motion_tokens.sh

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage (optional)
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false