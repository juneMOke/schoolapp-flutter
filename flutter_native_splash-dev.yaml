# Splash natif du flavor dev : fond Vert Savane (comme l'icône de lancement) et
# mention « DEV » en bas. La prod garde le bloc du pubspec.yaml.
# Visuels : scripts/generate_flavor_icons.py. Régénérer :
#   dart run flutter_native_splash:create --flavors dev,staging
flutter_native_splash:
  color: "#3D6B4A"
  image: assets/app-icon/ic_launcher_foreground.png
  branding: assets/app-icon/dev/splash_branding.png
  color_dark: "#3D6B4A"
  image_dark: assets/app-icon/ic_launcher_foreground.png
  branding_dark: assets/app-icon/dev/splash_branding.png
  # Décolle la mention du bord bas (Android < 12, iOS).
  branding_bottom_padding: 48
  android_12:
    image: assets/app-icon/ic_launcher_foreground.png
    color: "#3D6B4A"
    branding: assets/app-icon/dev/splash_branding.png
    image_dark: assets/app-icon/ic_launcher_foreground.png
    color_dark: "#3D6B4A"
    branding_dark: assets/app-icon/dev/splash_branding.png
  web: false
