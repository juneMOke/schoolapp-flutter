# Icône de lancement ETEELO CONNECT (prod, et seule icône du web et du bureau,
# qui n'ont pas de flavors). Linux n'est pas pris en charge par l'outil.
# Avec des fichiers flutter_launcher_icons-<flavor>.yaml, l'outil ignore le
# bloc du pubspec : chaque flavor a donc le sien. Régénérer :
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/app-icon/appstore_1024.png"
  android: true
  min_sdk_android: 21
  # Icône adaptative Android : symbole crème sur fond Bleu Profond uni.
  adaptive_icon_background: "#0E2D42"
  adaptive_icon_foreground: "assets/app-icon/ic_launcher_foreground.png"
  ios: true
  # iOS refuse la transparence : aplatir l'alpha sur le Bleu Profond.
  remove_alpha_ios: true
  background_color_ios: "#0E2D42"
  web:
    generate: true
    image_path: "assets/app-icon/appstore_1024.png"
    background_color: "#0E2D42"
    theme_color: "#0E2D42"
  macos:
    generate: true
    image_path: "assets/app-icon/appstore_1024.png"
  windows:
    generate: true
    image_path: "assets/app-icon/appstore_1024.png"
    icon_size: 48
