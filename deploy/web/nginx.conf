# Version web d'ETEELO CONNECT — fichiers statiques derrière Traefik.
# Traefik termine le TLS ; ce conteneur ne parle qu'en HTTP interne.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ⚠️ Pas de bloc `types { … }` ici : il REMPLACE toute la table MIME, et
    # HTML/JS partiraient en octet-stream — refusés sous `nosniff`. La table
    # par défaut de nginx connaît déjà `application/wasm`, indispensable au
    # SQLite du navigateur (`WebAssembly.instantiateStreaming`).

    # Les noms de Flutter ne sont pas hachés (main.dart.js, flutter_bootstrap.js,
    # sqflite_sw.js, canvaskit/) : tout se revalide à chaque ouverture, pour
    # qu'aucun poste ne garde une version périmée après une livraison. Ce
    # n'est pas un retéléchargement : inchangé, un fichier répond 304 (ETag).
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Jamais dans le cadre d'un autre site : les jetons de session vivent
    # dans le stockage du navigateur, une page piégée ne doit pas pouvoir
    # faire cliquer l'agent à son insu. Pas de CSP plus large : CanvasKit
    # compile du WebAssembly et lance des workers, qu'une politique stricte
    # casserait sans bruit.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    # La caméra sert à la photo de l'élève ; le reste n'a pas d'usage.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    # Les polices (Inter, Lora, Roboto Mono : ~2 Mo) et NOTICES (texte brut)
    # partaient non compressés.
    gzip_types text/css text/plain application/javascript application/json
               application/wasm image/svg+xml font/ttf font/otf
               application/x-font-ttf application/vnd.ms-fontobject;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
