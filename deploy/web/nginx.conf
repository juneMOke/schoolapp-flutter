# Version web d'ETEELO CONNECT — fichiers statiques derrière Traefik.
# Traefik termine le TLS ; ce conteneur ne parle qu'en HTTP interne.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ⚠️ Pas de bloc `types { … }` ici : il REMPLACE toute la table MIME, et
    # HTML/JS partiraient en octet-stream — refusés sous `nosniff`. La table
    # par défaut de nginx connaît déjà `application/wasm`, indispensable au
    # SQLite du navigateur (`WebAssembly.instantiateStreaming`).

    # Les noms de Flutter ne sont pas hachés (main.dart.js, flutter_bootstrap.js,
    # sqflite_sw.js) : tout se revalide à chaque ouverture, pour qu'aucun poste
    # ne garde une version périmée après une livraison.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
